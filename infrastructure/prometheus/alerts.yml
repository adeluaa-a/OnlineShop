groups:
  - name: onlineshop-alerts
    rules:
      - alert: NginxExporterDown
        expr: up{job="nginx"} == 0
        for: 30s
        labels:
          severity: critical
          service: nginx
        annotations:
          summary: "Nginx exporter is down"
          description: "Prometheus cannot scrape nginx-exporter for more than 30 seconds."
