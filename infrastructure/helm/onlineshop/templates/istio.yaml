{{- if .Values.istio.enabled }}

{{- range $name, $svc := .Values.services }}
{{- if or (eq $name "user") (eq $name "product") (eq $name "order") }}
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: {{ $name }}-service
  namespace: {{ $.Values.namespace }}
spec:
  host: {{ $name }}-service.{{ $.Values.namespace }}.svc.cluster.local
  trafficPolicy:
    connectionPool:
      http:
        http1MaxPendingRequests: 10
        maxRequestsPerConnection: 2
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 5s
      baseEjectionTime: 30s
      maxEjectionPercent: 100
{{- end }}
{{- end }}

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: user-service-retries
  namespace: {{ .Values.namespace }}
spec:
  hosts:
    - user-service
  http:
    - route:
        - destination:
            host: user-service
      retries:
        attempts: 3
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,5xx

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: product-service-retries
  namespace: {{ .Values.namespace }}
spec:
  hosts:
    - product-service
  http:
    - route:
        - destination:
            host: product-service
      retries:
        attempts: 3
        perTryTimeout: 1s
