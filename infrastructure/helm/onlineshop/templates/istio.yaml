---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: order-service-retries
  namespace: {{ .Values.namespace }}
spec:
  hosts:
    - order-service
  http:
    - route:
        - destination:
            host: order-service
      retries:
        attempts: 3
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,5xx

{{- end }}