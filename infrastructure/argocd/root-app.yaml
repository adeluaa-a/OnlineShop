apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onlineshop-root
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/adeluaa-a/OnlineShop.git
    targetRevision: HEAD
    path: infrastructure/argocd/apps
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
