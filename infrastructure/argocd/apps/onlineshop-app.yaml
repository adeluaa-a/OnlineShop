apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: onlineshop
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/adeluaa-a/OnlineShop.git
    targetRevision: HEAD
    path: infrastructure/helm/onlineshop

  destination:
    server: https://kubernetes.default.svc
    namespace: onlineshop

  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
